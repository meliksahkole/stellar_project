[package]
name = "hotel-payment-contract"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk = "23.0.3"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
rpath = false
lto = true


